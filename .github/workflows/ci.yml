name: Vaphia CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://vaphia-website.vercel.app
          NEXT_PUBLIC_YOUTUBE_URL: https://www.youtube.com/@vaphia
          NEXT_PUBLIC_TIKTOK_URL: https://www.tiktok.com/@vaphia
          NEXT_PUBLIC_INSTAGRAM_URL: https://www.instagram.com/vaphiaa/
